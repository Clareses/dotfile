run-shell $HOME/.config/tmux/themes/tmux-ayu-theme/tmux-ayu-theme.tmux

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

setw -g xterm-keys on
set-window-option -g xterm-keys on
set -s escape-time 0
set -sg repeat-time 2000
set -s focus-events on

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u
set -g status-right '#{?client_prefix,Prefix!,}'


set -g mouse on
set -sg exit-empty on
set -g detach-on-destroy off

set -q -g status-utf8 on
setw -q -g utf8 on

set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

set -g history-limit 100000

# allow kitty graphics protocol (e.g. `kitten icat`) to pass through tmux
set -g allow-passthrough all

# ? 
# set-hook -g pane-focus-in "run -b 'bash ~/.config/tmux/fzf_panes.tmux update_mru_pane_ids'"

set -ga update-environment '\
DISPLAY DBUS_SESSION_BUS_ADDRESS \
QT_IM_MODULE QT_QPA_PLATFORMTHEME \
SESSION_MANAGER \
XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME\
XDG_MENU_PREFIX XDG_RUNTIME_DIR XDG_SESSION_CLASS \
XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_CURRENT_DESKTOP \
XMODIFIERS \
FZF_DEFAULT_OPTS \
TMUX_THEME_COLOR \
'

set -g base-index 1
setw -g pane-base-index 1
set -g set-titles on

bind C-f resize-pane -Z

bind C-s switch-client -T split \; display "SPLIT MODE: h← l→ j↓ k↑"
bind -T split C-h split-window -hb -c "#{pane_current_path}" \; switch-client -T root
bind -T split C-l split-window -h  -c "#{pane_current_path}" \; switch-client -T root
bind -T split C-j split-window -v  -c "#{pane_current_path}" \; switch-client -T root
bind -T split C-k split-window -vb -c "#{pane_current_path}" \; switch-client -T root

bind H split-window -hb -c "#{pane_current_path}"  # left
bind L split-window -h  -c "#{pane_current_path}"  # right
bind J split-window -v  -c "#{pane_current_path}"  # down
bind K split-window -vb -c "#{pane_current_path}"  # up

# pane navigation without prefix (Ctrl + hjkl)
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

unbind w
unbind c
unbind -n C-BSpace

bind C-w choose-window
bind C-c new-window
bind s choose-session

bind-key -n C-h send-keys C-w

# Enter copy mode with prefix + Ctrl-[  (moved from prefix + [)
# NOTE: tmux reports Ctrl+[ as Escape (extended-keys mode 1 keeps keys
# that already have a well-known code), so bind Escape too.
unbind-key -T prefix \[
bind-key -T prefix C-[ copy-mode
bind-key -T prefix Escape copy-mode

# Enter copy mode with prefix + C-v
# bind C-v copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection
# Enter does nothing harmful in copy mode: same as Escape (clear selection,
# never exits); exit with q, a or i (vim-like "back to insert mode")
bind-key -T copy-mode-vi Enter send-keys -X clear-selection
bind-key -T copy-mode-vi a send-keys -X cancel
bind-key -T copy-mode-vi i send-keys -X cancel

# tmux defaults bind BOTH Enter and Ctrl+J to copy-pipe-and-cancel (i.e. exit).
# Override Ctrl+J so it just scrolls down like j, and never leaves copy mode.
bind-key -T copy-mode-vi C-j send-keys -X cursor-down

# Jump between pi user inputs in copy mode (pi emits OSC 133 prompt markers)
bind-key -T copy-mode-vi C-p send-keys -X previous-prompt
bind-key -T copy-mode-vi C-n send-keys -X next-prompt

# vim-like Ctrl+U/Ctrl+D: move the cursor 10 lines (viewport follows the cursor)
bind-key -T copy-mode-vi C-d send-keys -X -N 10 cursor-down
bind-key -T copy-mode-vi C-u send-keys -X -N 10 cursor-up

unbind n
unbind p
bind C-n next-window
bind C-p previous-window

unbind d
bind C-d detach-cli

