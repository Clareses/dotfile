# general {
#     lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
#     before_sleep_cmd = pidof hyprlock || hyprlock                                  # lock before suspend.
#     after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
# }

listener {
    timeout = 600                                # 10min.
    # Check the camera first (face-lock.sh): if you are present it just resets
    # the idle timer and does NOT lock; only when you are away does it take the
    # screenshot, start hyprlock and run susp.sh.
    on-timeout = sh "$HOME/.config/hypr/face-lock.sh"
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({action = on, monitor = "eDP-1"}))' && fish ~/.config/hypr/howdy-facial.sh && touch ~/.config/hypr/hyprland.lua
}
