########################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
########################################################################################
env = XCURSOR_SIZE,24
env = WAYLAND_DISPLAY
# env = QT_QPA_PLATFORMTHEME,qt5ct
# env = QT_QPA_PLATFORMTHEME,qt6ct

exec-once=fcitx5

# 告诉 wayland xwayland它自己会缩放两倍,让 wayland 不要管 xwayland 的缩放

# exec-once = xprop -root -f _XWAYLAND_GLOBAL_OUTPUT_SCALE 32c -set _XWAYLAND_GLOBAL_OUTPUT_SCALE 1.1

# 设置 xwayland 的 DPI 192, 一倍的 DPI 为96, 2倍即为192
xwayland {
    force_zero_scaling = true
}

exec-once = echo 'Xft.dpi:110' | xrdb -merge

# exec-once = swayidle -w timeout 300 'saver'
# exec-once = echo 'Xft.dpi:96' | xrdb -merge

misc {
    key_press_enables_dpms = false
    mouse_move_enables_dpms = true
}

# env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia



#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

autogenerated = 0 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1,2560x1440@60,0x0,1.07,transform,0
# monitor=HDMI-A-1,disable
# monitor=eDP-1,1920x1080@120,auto,1.00
# monitor=eDP-1,1920x1080,1920x0,1
# monitor=eDP-1,1920x1080,1920x0,1.00
# monitor=DP-1,1920x1080,2560x0,1.0,transform,0
# monitor=DP-1,1920x1080@60,0x0,1.0,transform,0
# monitor=DP-1,disable

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once=swaybg -i $HOME/pictures/壁纸/jpgs/a.jpg -m fill # exec-once=python $HOME/kaoyan/date.py && swaybg -i $HOME/kaoyan/date.png -m fill
exec-once=waybar
exec-once=mako
# exec-once=io.github.alainm23.planify
exec-once=hyprctl setcursor breeze_cursors 28
exec-once=pulseaudio -k && pulseaudio --start
# exec-once=v2raya --lite --log-file $HOME/.v2raya.log
# exec-once=clash-verge
# env=http_proxy,http://127.0.0.1:7897
# env=https_proxy,http://127.0.0.1:7897
# env=all_proxy,socks5://127.0.0.1:7897

exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Source a file (multi-file configs)

# Some default env vars.

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    #kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        scroll_factor = 0.5
    }

    sensitivity = -1.0 # -1.0 - 1.0, 0 means no modification.
}




general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 3
    gaps_out = 6
    border_size = 5
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    shadow:enabled = true

    blur {
        enabled = true
        size = 1
        passes = 1
        new_optimizations = true
        ignore_opacity = true
    }

    # drop_shadow = yes
    shadow:range = 4
    shadow:render_power = 3
    shadow:color = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

# master {
#     # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#     new_is_master = true
# }

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = off
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name = elan1203:00-04f3:307a-touchpad
    sensitivity = 0.3
    enabled = true
}

# Example windowrule v1
# Example windowrule v2
# windowrulev2 = opacity 1 0.88 , 
# windowrulev2 = opacity 0.88 0.88, class:(.*)(planify)$
# windowrulev2 = workspace special:planner, class:(.*)(planify)$
# windowrulev2 = float, title:Translate # Translation window floating
# windowrulev2 = move cursor 0 0, title:Translate # Translation window follows the mouse position.

# noanim isn't necessary but animations with these rules might look bad. use at your own discretion.
# windowrule = noanim, class:^(flameshot)$
# windowrule = float, class:^(flameshot)$
# windowrule = move 0 0, class:^(flameshot)$
# windowrule = pin, class:^(flameshot)$
# windowrule = monitor 1, class:^(flameshot)$
# bind = $mainMod+ctrl, A, exec, XDG_CURRENT_DESKTOP=sway flameshot gui

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# windowrulev2 = noanim, class:^(gluqlo)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, /bin/kitty fish
# bind = $mainMod, escape, exec, 
bind = $mainMod shift, Q, killactive,
# bind = $mainMod, Q, exec, alacritty
# bind = $mainMod, M, exit, 
# bind = $mainMod, E, exec, dolphin
bind = $mainMod+shift, SPACE, togglefloating, 
bind = $mainMod, d, exec, env -u XMODIFIERS -u GTK_IM_MODULE -u QT_IM_MODULE rofi -show drun
bind = $mainMod, w, exec, env -u XMODIFIERS -u GTK_IM_MODULE -u QT_IM_MODULE rofi -show window
bind = $mainMod, e, exec, env -u XMODIFIERS -u GTK_IM_MODULE -u QT_IM_MODULE rofi -show run
# bind = $mainMod, e, exec, fuzzel --list-executables-in-path -p " " --fuzzy-max-distance 2
# bind = $mainMod, d, exec, fuzzel -p "  " --fuzzy-max-distance 2
bind = $mainMod, f, fullscreen
# bind = $mainMod, h, minimize
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle


# Move focus with mainMod + arrow keys
bind = $mainMod, l, movefocus, r
bind = $mainMod, h, exec, touch ~/.from_window && fish ~/.config/hypr/try-move-left.fish
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


bind = $mainMod+shift, h, movewindow, l
bind = $mainMod+shift, l, movewindow, r
bind = $mainMod+shift, k, movewindow, u
bind = $mainMod+shift, j, movewindow, d

# bind = $mainMod+ctrl, A, exec, sc copy area
bind = $mainMod+ctrl, E, exec, sc edit area

# bind = $mainMod+ctrl, A, exec, flameshot gui
# bind = $mainMod+ctrl, A, exec, slurp | grim -g - - | wl-copy
# bind = $mainMod+ctrl, A, exec, slurp | grim -g - - | satty --filename - --copy-command wl-copy
# bind = $mainMod+ctrl, A, exec, echo 0,0 1920x1080 | grim -g - - | satty --filename - --init-tool crop --fullscreen --copy-command wl-copy --output-filename $HOME/pictures/Screenshots/$(date +%Y-%m-%d-%H-%M-%S).png --early-exit
bind = $mainMod+ctrl, A, exec, echo 0,0 2400x1350 | grim -g - - | satty --filename - --init-tool crop --fullscreen --copy-command wl-copy --output-filename $HOME/pictures/Screenshots/$(date +%Y-%m-%d-%H-%M-%S).png --early-exit
# bind = $mainMod+ctrl+shift, A, exec, echo 1920, 0 1920x1080 | grim -g - - | satty --filename - --init-tool crop --fullscreen --copy-command wl-copy --output-filename $HOME/Pictures/Screenshots/$(date +%Y-%m-%d-%H-%M-%S).png --early-exit
bind = $mainMod, u, exec, grim -g "0,0 1920x1080" ~/pictures/screenlock.png && hyprlock

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
workspace = 11, monitor:DP-1, persistent:true

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, backspace, workspace, 11


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, backspace, movetoworkspace,11

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind= SUPER,1,submap,words
submap=words
bind = ctrl, j, exec, ydotool mousemove -a -- 200 475 && ydotool click 0xC0
bind = ctrl, k, exec, ydotool mousemove -a -- 500 475&& ydotool click 0xC0
bind = ctrl, l, exec, ydotool mousemove -a -- 800 475 && ydotool click 0xC0
bind = ctrl, a, exec, ydotool mousemove -a -- 500 200 && ydotool click 0xC0
bind = ctrl, b, exec, ydotool mousemove -a -- 500 275 && ydotool click 0xC0 
bind = ctrl, c, exec, ydotool mousemove -a -- 500 325 && ydotool click 0xC0 
bind = ctrl, d, exec, ydotool mousemove -a -- 500 400 && ydotool click 0xC0 
bind = ctrl, backspace, exec, ydotool mousemove -a -- 920 25 && ydotool click -r 2 0xC0

bind= SUPER,backspace,submap,reset
submap=reset


bind= $mainMod,g,submap,game
submap=game

# bind = $mainMod, s, exec, $HOME/.config/hypr/susp.sh
bind = $mainMod, s, exec, hyprctl dispatch dpms toggle

bind= $mainMod,g,submap,reset
submap=reset



bind = $mainMod SHIFT, M, togglespecialworkspace, magic
# bind = $mainMod SHIFT, M, movetoworkspace, +0
# bind = $mainMod SHIFT, M, togglespecialworkspace, magic
# bind = $mainMod SHIFT, M, movetoworkspace, special:magic
# bind = $mainMod SHIFT, M, togglespecialworkspace, magic

bind = $mainMod SHIFT, return, exec, bash $HOME/.config/hypr/fresh.sh
bind = $mainMod SHIFT, P, togglespecialworkspace, planner

# Example volume button that allows press and hold, volume limited to 150%
# bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%
# bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%
# bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +0.5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -0.5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bind = $mainMod, a, exec, fish $HOME/.config/hypr/copy.sh

# --- mako notifications: match Hyprland's rounded + blurred look ---
layerrule = blur, notifications
layerrule = ignorealpha 0.5, notifications
